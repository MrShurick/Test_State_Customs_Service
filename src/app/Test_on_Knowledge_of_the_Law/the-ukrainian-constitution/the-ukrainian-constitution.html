<div class="main">
    <div class="head">
        <button 
            class="btnBack" 
            type="button"
            (click)="back()"
            >
            Назад
        </button>

        <h1>Питання на перевірку знання Конституції України</h1>
    </div>

    <div class="block-1">
        <div class="numb">
            <h3>{{questions().length}} / {{questInd()}}</h3>
        </div>
        @for (test of [questions()[questInd()]]; track $index; let q = $index) {
            <div 
                class="test"
                [class.nextQuest]="isAnimate()"
                >
                <h3>{{test.question}}</h3>

                @for (answer of test.options; track $index; let a = $index) {
                    <div 
                        class="divInput"
                        [class.correct-answer]="isCorrectAnswer(test, q, answer)"
                        >
                        <input 
                            type="radio" 
                            [id]="'q-' + q + '-a-' + a"
                            [name]="'question-' + q"
                            [checked]="selectedAnswers()[q] === answer"
                            (click)="onRadioClic($event, q, answer)"
                        >
                        <label [for]="'q-' + q + '-a-' + a"> {{answer}} </label>
                    </div>
                }
            </div>
        }

        <div class="btnNextBack">
            <button 
                class="btnBackTest"
                type="button"
                (click)="backOffer()"
                >
                <img src="/free-icon-back-left-arrow-square-button-outline-54921.png" alt="" width="64">
            </button>

            <button 
                class="btnNextTest"
                type="button"
                (click)="nextOffer()"
                >
                <img src="/free-icon-back-left-arrow-square-button-outline-54921.png" alt="" class="leftarr" width="64">
            </button>
        </div>
    </div>
</div>
